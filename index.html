<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="AssurImpôts" />
  <title>AssurImpôts — Accès privé</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3" />
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; min-height: 100%; background: #070b14; color: #e2e8f0; overscroll-behavior-y: contain; }
    body {
      font: 16px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      min-height: 100vh; display: grid; place-items: center; touch-action: manipulation;
      padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
      box-sizing: border-box; overflow-x: hidden;
    }
    .card { width: min(380px, 100%); background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; padding: 28px 24px; box-sizing: border-box; }
    .logo { width: 64px; height: 64px; border-radius: 16px; display: block; margin: 0 auto 14px; }
    h1 { font-size: 20px; text-align: center; margin: 0 0 4px; }
    p.sub { text-align: center; color: #94a3b8; font-size: 14px; margin: 0 0 18px; }
    input[type=password] {
      width: 100%; box-sizing: border-box; font-size: 16px; padding: 13px 14px; border-radius: 12px;
      border: 1px solid #334155; background: #020617; color: #e2e8f0; outline: none;
    }
    input[type=password]:focus { border-color: #10b981; }
    label.rem { display: flex; align-items: center; gap: 8px; margin: 12px 2px 0; font-size: 14px; color: #cbd5e1; }
    button { width: 100%; margin-top: 16px; padding: 13px; font-size: 16px; font-weight: 600; border: 0; border-radius: 12px; background: #10b981; color: #fff; }
    button:disabled { opacity: .6; }
    #msg { min-height: 1.3em; margin-top: 12px; text-align: center; font-size: 14px; color: #f87171; }
    .foot { margin-top: 14px; text-align: center; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <form class="card" id="f" autocomplete="on">
    <img class="logo" src="icon.svg" alt="" />
    <h1>AssurImpôts &amp; Contrats</h1>
    <p class="sub">Coffre chiffré — accès privé</p>
    <input name="username" autocomplete="username" value="thomas" hidden />
    <input id="p" name="password" type="password" autocomplete="current-password" placeholder="Phrase de passe" required />
    <label class="rem"><input type="checkbox" id="rem" checked /> Rester déverrouillé sur cet appareil</label>
    <button id="b">Déverrouiller</button>
    <div id="msg"></div>
    <div class="foot">Chiffrement AES-256-GCM · PBKDF2-SHA256 600 000 itérations</div>
  </form>
  <script src="data/app.enc.js?v=202611092232"></script>
  <script>
    (function () {
      const KEY_STORE = "assur_unlock_key_v1";
      const enc = window.ASSUR_ENC;
      const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
      const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
      const msg = (t) => { document.getElementById("msg").textContent = t || ""; };

      async function deriveKey(pass) {
        const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]
        );
      }

      async function decryptWith(key) {
        const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.ct));
        return new TextDecoder().decode(plain);
      }

      function launch(html) {
        document.open();
        document.write(html);
        document.close();
      }

      async function tryRemembered() {
        const raw = localStorage.getItem(KEY_STORE);
        if (!raw) return false;
        try {
          const saved = JSON.parse(raw);
          if (saved.salt !== enc.salt) throw new Error("salt");
          const key = await crypto.subtle.importKey("raw", b64(saved.k), "AES-GCM", false, ["decrypt"]);
          launch(await decryptWith(key));
          return true;
        } catch (_) {
          localStorage.removeItem(KEY_STORE);
          return false;
        }
      }

      if (!enc || !window.crypto || !crypto.subtle) {
        msg("Navigateur incompatible (HTTPS requis).");
        return;
      }

      tryRemembered().then((ok) => { if (!ok) document.getElementById("p").focus(); });

      document.getElementById("f").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("b");
        const pass = document.getElementById("p").value;
        btn.disabled = true; msg(""); btn.textContent = "Déchiffrement…";
        try {
          const key = await deriveKey(pass);
          const html = await decryptWith(key);
          if (document.getElementById("rem").checked) {
            const raw = await crypto.subtle.exportKey("raw", key);
            localStorage.setItem(KEY_STORE, JSON.stringify({ salt: enc.salt, k: toB64(raw) }));
          }
          window.__ASSUR_PASS = pass; // en mémoire seulement : sert à ouvrir la session du Mac
          launch(html);
        } catch (_) {
          if (navigator.vibrate) navigator.vibrate(60);
          msg("Phrase de passe incorrecte.");
          btn.disabled = false; btn.textContent = "Déverrouiller";
        }
      });
    })();
  </script>
</body>
</html>
